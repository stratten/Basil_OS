name: Validate Basil

on:
  pull_request:
  push:
    branches: [main]
    # A push that changes only the README skips the tests and the signed build; the newest build artifact still matches the last code change.
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/spelling/check_american_spelling.py
      - run: python scripts/check_literal_structural_colors.py
      - run: build/scripts/changelog_section.sh Unreleased > /dev/null
      - run: build/scripts/test_update_appcast.sh
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      - run: poetry install --no-interaction
      - run: PYTHONPATH=.:backend/src poetry run pytest backend/src/tests -q

  web-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "web-components/**/package-lock.json"
      - name: Install, typecheck, test, and build each web component
        run: |
          for package_dir in web-components/*; do
            [ -f "$package_dir/package.json" ] || continue
            (
              cd "$package_dir"
              npm ci
              npm run typecheck --if-present
              npm run test --if-present
              npm run build
            )
          done

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --package-path client

  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web-components, macos-client]
    runs-on: macos-26
    timeout-minutes: 240
    environment: release-build
    concurrency:
      group: release-build-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      BASIL_NOTARY_KEYCHAIN_PROFILE: basil-ci-notary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Ensure build disk space
        run: |
          available_gb=$(( $(df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1048576 ))
          echo "Available before cleanup: ${available_gb} GB"
          if [ "$available_gb" -lt 25 ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sudo rm -rf "$ANDROID_HOME"
            available_gb=$(( $(df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1048576 ))
            echo "Available after removing the Android SDK: ${available_gb} GB"
          fi
          if [ "$available_gb" -lt 25 ]; then
            echo "::error::The release build needs at least 25 GB free; ${available_gb} GB is available."
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install bash cmake llvm tesseract tbb libsndfile portaudio coreutils
          python -m pip install poetry==2.1.3 pillow==10.4.0

      - name: Install Python dependencies
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: poetry install --no-interaction

      - name: Import signing identity and notary credentials
        env:
          BASIL_DEVELOPER_ID_P12_BASE64: ${{ secrets.BASIL_DEVELOPER_ID_P12_BASE64 }}
          BASIL_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BASIL_DEVELOPER_ID_P12_PASSWORD }}
          BASIL_DEVELOPER_ID_CERT: ${{ secrets.BASIL_DEVELOPER_ID_CERT }}
          BASIL_NOTARY_API_KEY_P8_BASE64: ${{ secrets.BASIL_NOTARY_API_KEY_P8_BASE64 }}
          BASIL_NOTARY_API_KEY_ID: ${{ secrets.BASIL_NOTARY_API_KEY_ID }}
          BASIL_NOTARY_API_ISSUER_ID: ${{ secrets.BASIL_NOTARY_API_ISSUER_ID }}
        run: build/scripts/ci_import_signing_identity.sh

      - name: Resolve the repository update channel
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.BASIL_SPARKLE_REPO_PUBLIC_ED_KEY }}
        run: |
          if [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::The release-build environment needs the BASIL_SPARKLE_REPO_PUBLIC_ED_KEY variable."
            exit 1
          fi
          app_version="$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' CHANGELOG.md)"
          if [ -z "$app_version" ]; then
            echo "::error::CHANGELOG.md has no released '## X.Y.Z' section to take the display version from."
            exit 1
          fi
          {
            echo "BASIL_APP_VERSION=$app_version"
            echo "BASIL_SPARKLE_FEED_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/update-feed/appcast.xml"
            echo "BASIL_SPARKLE_PUBLIC_ED_KEY=$SPARKLE_PUBLIC_ED_KEY"
            echo "BASIL_SPARKLE_REQUIRE_SIGNED_FEED=1"
          } >> "$GITHUB_ENV"

      - name: Build, sign, and notarize Basil
        env:
          BASIL_DEVELOPER_ID_CERT: ${{ secrets.BASIL_DEVELOPER_ID_CERT }}
          BASIL_APPLE_TEAM_ID: ${{ secrets.BASIL_APPLE_TEAM_ID }}
          BASIL_SOURCE_COMMIT: ${{ github.sha }}
          BASIL_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: build/scripts/build_app.sh --notarize --skip-app-notarize --version "$BASIL_APP_VERSION"

      - name: Check and stage the release artifact
        id: stage
        env:
          BASIL_EXPECTED_PUBLIC_ED_KEY: ${{ vars.BASIL_SPARKLE_REPO_PUBLIC_ED_KEY }}
        run: |
          shopt -s nullglob
          apps=(build/outputs/*/Basil.app)
          dmgs=(build/outputs/*/Basil-*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Basil.app and one DMG under build/outputs; found ${#apps[@]} and ${#dmgs[@]}."
            exit 1
          fi
          build/scripts/verify_bundle_self_contained.sh "${apps[0]}"
          short_sha="${GITHUB_SHA:0:12}"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          dmg_name="Basil-main-${short_sha}.dmg"
          cp "${dmgs[0]}" "$release_dir/$dmg_name"
          build/scripts/verify_release_artifact.sh "$release_dir/$dmg_name" "$GITHUB_SHA"
          (cd "$release_dir" && shasum -a 256 "$dmg_name" > SHA256SUMS.txt)
          {
            echo "app_path=${apps[0]}"
            echo "dmg_path=$release_dir/$dmg_name"
            echo "dmg_name=$dmg_name"
            echo "sums_path=$release_dir/SHA256SUMS.txt"
            echo "short_sha=$short_sha"
            echo "dmg_sha256=$(awk '{print $1}' "$release_dir/SHA256SUMS.txt")"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.dmg_path }}

      - name: Record the build metadata
        env:
          APP_PATH: ${{ steps.stage.outputs.app_path }}
          DMG_NAME: ${{ steps.stage.outputs.dmg_name }}
        run: |
          info_plist="$APP_PATH/Contents/Info.plist"
          {
            echo "BASIL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
            echo "BASIL_APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
            echo "BASIL_SOURCE_COMMIT=$GITHUB_SHA"
            echo "BASIL_DMG_NAME=$DMG_NAME"
          } > "$RUNNER_TEMP/release/build-info.env"

      - name: Upload the build for later promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basil-build-${{ github.sha }}
          path: |
            ${{ steps.stage.outputs.dmg_path }}
            ${{ steps.stage.outputs.sums_path }}
            ${{ runner.temp }}/release/build-info.env
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${BASIL_NOTARY_KEYCHAIN:-}" ]; then
            security delete-keychain "$BASIL_NOTARY_KEYCHAIN" || true
          fi
