[pytest]
markers =
    integration: marks tests as integration tests that use real models
    asyncio: marks tests as asyncio tests
    e2e: marks full end-to-end tests using real app infra
    manual: marks a test that requires an explicitly authorized, isolated native-app or account fixture

# Collect only first-party tests and memvid (vendored but heavily modified)
testpaths =
    src/tests
    src/api/vendor/memvid/tests

# Ignore specific slow/unused model tests and set default verbosity/output behavior
addopts =
    -q
    -rA
    -m "not manual"
    --ignore=src/tests/core/model_tests/test_phi2_model.py
    --ignore=src/tests/core/model_tests/test_deepseek_model.py
    --ignore=src/api/vendor/diart/diart-main/tests

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore:.*SwigPyPacked has no __module__ attribute.*:DeprecationWarning
    ignore:.*SwigPyObject has no __module__ attribute.*:DeprecationWarning
    ignore:.*swigvarlink has no __module__ attribute.*:DeprecationWarning 
    
# Do not collect other vendored third-party tests by default
norecursedirs = 
    src/vendor